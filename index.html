<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d2b22" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Brydż online dla dwóch osób - graj licytację i rozgrywkę z drugą osobą w innym miejscu, roboty obsadzają wolne miejsca."
    />
    <title>Bridge Online — brydż dla dwojga</title>
    <link rel="canonical" href="https://brydz.uk/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Zajawka linku. Caly produkt polega na "utworz stol i wyslij link partnerowi", a link
         wklejony w komunikator pokazywal goly URL — bez tytulu, opisu i obrazka, czyli dokladnie
         tak, jak wyglada spam. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bridge Online" />
    <meta property="og:url" content="https://brydz.uk/" />
    <meta property="og:title" content="Brydż online dla dwojga" />
    <meta
      property="og:description"
      content="Zagraj pełne rozdanie z drugą osobą, choćby była na drugim końcu Polski — licytacja i rozgrywka jak przy stole, a wolne krzesła zajmują roboty."
    />
    <meta property="og:image" content="https://brydz.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bridge Online — cztery asy na zielonym suknie" />
    <meta property="og:locale" content="pl_PL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brydż online dla dwojga" />
    <meta
      name="twitter:description"
      content="Licytacja i rozgrywka jak przy stole. Wyślij link, usiądźcie we dwoje, roboty zajmą resztę miejsc."
    />
    <meta name="twitter:image" content="https://brydz.uk/og-image.png" />
    <!-- Fonty z wlasnego hosta (public/fonts, nazwa z hashem tresci, cache na rok): Google Fonts
         to bylo 78% bajtow pierwszego wejscia i dwa dodatkowe polaczenia. Podzbior latin + latin-ext
         (U+0100-017F), Inter 400-700, Source Serif 4 600-700 z osia opsz 8..60. -->
    <link rel="preload" href="/fonts/inter-var-b1ae77c9.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/inter-var-b1ae77c9.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Source Serif 4';
        font-style: normal;
        font-weight: 600 700;
        font-display: swap;
        src: url('/fonts/source-serif-4-var-03a2b8a9.woff2') format('woff2');
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ta gra wymaga włączonego JavaScriptu.</noscript>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
