<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2b22" />
    <meta
      name="description"
      content="Brydż online dla dwóch osób - graj licytację i rozgrywkę z drugą osobą w innym miejscu, roboty obsadzają wolne miejsca."
    />
    <title>Bridge Online — brydż dla dwojga</title>
    <link rel="canonical" href="https://brydz.uk/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Zajawka linku. Caly produkt polega na "utworz stol i wyslij link partnerowi", a link
         wklejony w komunikator pokazywal goly URL — bez tytulu, opisu i obrazka, czyli dokladnie
         tak, jak wyglada spam. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bridge Online" />
    <meta property="og:url" content="https://brydz.uk/" />
    <meta property="og:title" content="Brydż online dla dwojga" />
    <meta
      property="og:description"
      content="Zagraj pełne rozdanie z drugą osobą, choćby była na drugim końcu Polski — licytacja i rozgrywka jak przy stole, a wolne krzesła zajmują roboty."
    />
    <meta property="og:image" content="https://brydz.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bridge Online — cztery asy na zielonym suknie" />
    <meta property="og:locale" content="pl_PL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brydż online dla dwojga" />
    <meta
      name="twitter:description"
      content="Licytacja i rozgrywka jak przy stole. Wyślij link, usiądźcie we dwoje, roboty zajmą resztę miejsc."
    />
    <meta name="twitter:image" content="https://brydz.uk/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
